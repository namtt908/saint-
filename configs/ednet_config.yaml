# SAINT+ Configuration for EdNet Dataset

# Data configuration
data:
  raw_path: "data/raw/ednet"
  processed_path: "data/processed"
  sequence_length: 200
  train_ratio: 0.8
  val_ratio: 0.1

# Model configuration
model:
  d_model: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  max_seq_length: 200

# Training configuration
training:
  batch_size: 32
  learning_rate: 1e-4
  num_epochs: 20
  device: "cuda"
  num_workers: 4
  output_dir: "outputs"
  
# Evaluation configuration
evaluation:
  threshold: 0.5
  metrics: ["auc", "accuracy", "precision", "recall", "f1"] 